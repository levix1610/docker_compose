# Vikunja docker compose for homelab task tracking

services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    container_name: vikunja
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - /opt/appdata/vikunja/db:/db
      - /opt/appdata/vikunja/files:/app/vikunja/files
    environment:
      - TZ=America/New_York
      - VIKUNJA_DATABASE_TYPE=sqlite
      - VIKUNJA_DATABASE_PATH=/db/vikunja.db
      - VIKUNJA_SERVICE_JWTSECRET=change_this_to_a_long_random_string
      # Set this to your local IP or domain if accessing across your network (e.g., http://192.168.1.100:3456)
      - VIKUNJA_SERVICE_PUBLICURL=http://localhost:3456